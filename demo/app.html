<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VU Admin – app demo</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
    integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    integrity="sha512-dPXYcDub/aeb08c63jRq/k6GaKccl256JQy/AnOq7CAnEZ9FzSL9wSbcZkMp4R26vBsMLFYH4kQ67/bbV8XaCQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.31/vue.global.min.js"
    integrity="sha512-uFfFhP36JMGvEaE2jlZ8Hprsae8dNhmM7ZioMF8Wy8/z2ZtRq1FF+znjWOYeU3hpDenXQoCih190zwwoZ/9EbQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <link rel="stylesheet" href="./../dist/vu-admin.css" />

</head>

<body>

  <!--
    The same dummyjson.com demo as index.html, but the whole page is one <vu-admin-app>:
    header (brand, nav, user menu), dashboard (counters + tables) and the entity views switched by the URL hash
    (#products, #carts) without a page reload. The page is configured by window.VuSettings.app below.
    `session` replaces the sign-in (dummyjson has no login here) and nothing is stored in localStorage.
  -->
  <div id="app">
    <vu-admin-app :session="session"></vu-admin-app>
  </div>

  <script src="./../dist/vu-admin.umd.js"></script>
  <script src="./vu-settings.js"></script>

  <script>

    window.VuSettings.app = {
      title: 'VU Admin demo',
      logo: 'https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/icons/grid-3x3-gap-fill.svg',
      brand: { href: '#', height: 24 },
      header: { class: 'sticky-top navbar navbar-expand p-2 border shadow bg-body gap-2' },
      nav: { url: './navs.json', menu: 'admin' },
    };

    Object.assign(window.VuSettings.translate.hu, {
      'VU Admin demo': 'VU Admin demó',
      'Latest products': 'Legújabb termékek',
      'Biggest carts': 'Legnagyobb kosarak',
    });

    const app = Vue.createApp({
      data() {
        return {
          session: {
            success: true,
            user: {
              firstName: 'User',
              lastName: 'Test',
              email: 'emilys@example.com',
              image: 'https://picsum.photos/id/137/200/200',
            },
            header: {},
            settings: {
              entitiesVariable: 'VuEntities',
              entities: {
                products: { url: './vu-entity-products.js', title: 'Products' },
                carts: { url: './vu-entity-demo.js', title: 'Carts' },
              },
              // start page ("#"); dummyjson ignores most filters, so the counters show the totals
              dashboard: {
                class: 'row g-3',
                items: [
                  { type: 'count', entity: 'products', title: 'Products', icon: 'bi bi-box-seam', class: 'col-6' },
                  { type: 'count', entity: 'carts', title: 'Carts', icon: 'bi bi-cart3', class: 'col-6' },
                  {
                    entity: 'products',
                    class: 'col-lg-6',
                    title: 'Latest products',
                    limit: 5,
                    limits: [5, 10, 20],
                    pages: 5,
                    filters: false,
                    order: { id: 'DESC' },
                    columns: ['thumbnail', 'title', 'price', 'stock', '#buttons'],
                  },
                  {
                    entity: 'carts',
                    class: 'col-lg-6',
                    title: 'Biggest carts',
                    limit: 5,
                    limits: [5, 10, 20],
                    pages: 5,
                    filters: false,
                    order: { total: 'DESC' },
                    columns: ['id', 'userId', 'totalProducts', 'total', '#buttons'],
                  },
                ],
              },
            },
          },
        };
      },
    });
    app.component('vu-admin-app', VuAdmin.VuAdminApp);
    app.mount('#app');

  </script>

</body>

</html>
