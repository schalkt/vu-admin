<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
    integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    integrity="sha512-dPXYcDub/aeb08c63jRq/k6GaKccl256JQy/AnOq7CAnEZ9FzSL9wSbcZkMp4R26vBsMLFYH4kQ67/bbV8XaCQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.31/vue.global.min.js"
    integrity="sha512-uFfFhP36JMGvEaE2jlZ8Hprsae8dNhmM7ZioMF8Wy8/z2ZtRq1FF+znjWOYeU3hpDenXQoCih190zwwoZ/9EbQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <link rel="stylesheet" href="./../dist/vu-admin.css" />

</head>

<body>

  <div class="container-fluid" id="app">

    <header class="sticky-top navbar navbar-expand p-2 border shadow bg-body gap-2">
      <vu-admin-nav v-model="auth" :url="'./navs.json'"></vu-admin-nav>
      <vu-user-button v-model="auth" :panel="'login'"></vu-user-button>
      <vu-user-button v-model="auth" :panel="'registration'"></vu-user-button>
      <vu-auth v-model="auth" :settings="'auth'"></vu-auth>
    </header>

    <details class="border rounded p-3 my-3 bg-body-tertiary">
      <summary class="fw-bold">{{ t('What can you try?') }} <small class="text-muted fw-normal">{{ t('(dummyjson.com — changes are not persisted)') }}</small></summary>
      <div class="row small mt-2">
        <div class="col-md-6">
          <strong>{{ t('Products table') }}</strong>
          <ul class="mb-2">
            <li v-for="text in help.products" :key="text" v-html="t(text)"></li>
          </ul>
        </div>
        <div class="col-md-6">
          <strong>{{ t('Product form') }}</strong>
          <ul class="mb-2">
            <li v-for="text in help.form" :key="text" v-html="t(text)"></li>
          </ul>
          <strong>{{ t('Carts table') }}</strong>
          <ul class="mb-0">
            <li v-for="text in help.carts" :key="text" v-html="t(text)"></li>
          </ul>
        </div>
      </div>
    </details>

    <div v-cloak v-if="auth.success">
      <section id="products" class="mb-5">
        <vu-admin :entity="'products'" :auth="auth"></vu-admin>
      </section>
      <section id="carts" class="mb-5">
        <vu-admin :entity="'carts'" :auth="auth"></vu-admin>
      </section>
    </div>

  </div>

  <script src="./../dist/vu-admin.umd.js"></script>
  <script src="./vu-settings.js"></script>

  <script>

    // texts of this page (the "What can you try?" box); keys are the English texts
    const pageTranslations = {
      hu: {
        'What can you try?': 'Mit próbálhatsz ki?',
        '(dummyjson.com — changes are not persisted)': '(dummyjson.com — a módosítások nem mentődnek)',
        'Products table': 'Termékek táblázat',
        'Product form': 'Termék űrlap',
        'Carts table': 'Kosarak táblázat',
        'Sort by clicking a header (multiple columns too, but dummyjson only uses the first one)':
          'Rendezés a fejlécre kattintva (több oszlop szerint is, de a dummyjson csak az elsőt használja)',
        'Filters: the <em>Product</em> search and the <em>Category</em> filter really filter, the others are only visible':
          'Szűrők: a <em>Termék</em> keresés és a <em>Kategória</em> szűrő valóban szűr, a többi csak megjelenik',
        'Pagination, rows per page selector': 'Lapozás, sor / oldal választó',
        'Columns: show / hide, collapse (<i class="bi bi-arrows-collapse-vertical"></i>), "Expand all", "Reset" — kept in localStorage':
          'Oszlopok: megjelenítés / elrejtés, összecsukás (<i class="bi bi-arrows-collapse-vertical"></i>), „Mind kinyit”, „Alaphelyzet” — localStorage-ban megmarad',
        'Inline editing (title, stock, price, availability) with autosave, row save button':
          'Soron belüli szerkesztés (név, készlet, ár, elérhetőség) automatikus mentéssel, sor mentése gomb',
        'Row selection (#), bulk edit and delete in the footer row': 'Sorok kijelölése (#), tömeges szerkesztés és törlés a lábléc sorban',
        'Row details (expandable), custom action button, CSV export, "More" dropdown':
          'Sor részletei (kinyitható), egyedi művelet gomb, CSV export, „Továbbiak” menü',
        'Fields: text, number, select, dropdown (multi), date, checkbox, textarea, list, template':
          'Mezők: szöveg, szám, választó, legördülő (többes), dátum, jelölőnégyzet, szövegterület, lista, sablon',
        'HTML editor (TipTap) with image, link and video embed': 'HTML szerkesztő (TipTap) kép, link és videó beágyazással',
        'Image upload: drag &amp; drop, preview, image editor, translatable titles, tags':
          'Képfeltöltés: drag &amp; drop, előnézet, képszerkesztő, fordítható címek, címkék',
        'Save, save and close, copy, new, delete, reload': 'Mentés, mentés és bezárás, másolás, új, törlés, újratöltés',
        'Dark theme, relation (user name, avatar), sorting, collapsed column, CSV':
          'Sötét téma, kapcsolat (felhasználónév, avatar), rendezés, összecsukott oszlop, CSV',
        'Read-only form with a template field': 'Csak olvasható űrlap sablon mezővel',
      },
    };

    const app = Vue.createApp({
      data() {
        return {
          auth: {},
          language: window.VuAdminHelpers.getLanguage(),
          help: {
            products: [
              'Sort by clicking a header (multiple columns too, but dummyjson only uses the first one)',
              'Filters: the <em>Product</em> search and the <em>Category</em> filter really filter, the others are only visible',
              'Pagination, rows per page selector',
              'Columns: show / hide, collapse (<i class="bi bi-arrows-collapse-vertical"></i>), "Expand all", "Reset" — kept in localStorage',
              'Inline editing (title, stock, price, availability) with autosave, row save button',
              'Row selection (#), bulk edit and delete in the footer row',
              'Row details (expandable), custom action button, CSV export, "More" dropdown',
            ],
            form: [
              'Fields: text, number, select, dropdown (multi), date, checkbox, textarea, list, template',
              'HTML editor (TipTap) with image, link and video embed',
              'Image upload: drag &amp; drop, preview, image editor, translatable titles, tags',
              'Save, save and close, copy, new, delete, reload',
            ],
            carts: [
              'Dark theme, relation (user name, avatar), sorting, collapsed column, CSV',
              'Read-only form with a template field',
            ],
          },
        }
      },
      methods: {
        t(key) {
          return (pageTranslations[this.language] || {})[key] || key;
        },
      },
      created() {
        document.documentElement.lang = this.language;
        // the user menu language switch fires this event (LANGUAGE_CHANGE_EVENT in src/i18n.js)
        window.addEventListener('vu-language-change', (event) => {
          this.language = event.detail.language;
          document.documentElement.lang = this.language;
        });
      },
      mounted() {

        this.auth.success = true;
        this.auth.user = {
          firstName: 'User',
          lastName: 'Test',
          email: 'emilys@example.com',
          image: 'https://picsum.photos/id/137/200/200'
        };

        this.auth.settings = {
          entitiesVariable: 'VuEntities',
          entities: {
            products: './vu-entity-products.js',
            carts: './vu-entity-demo.js',
          }
        };


      }
    });
    app.component('vu-admin', VuAdmin.VuAdmin);
    app.component('vu-auth', VuAdmin.VuAuth);
    app.component('vu-user-button', VuAdmin.VuUserButton);
    app.component('vu-admin-nav', VuAdmin.VuAdminNav);
    app.mount('#app');

  </script>

</body>

</html>
